name: Regression – Launch Hardening
# Runs the Studio launch-hardening smoke tests on every push / PR against
# the staging branch. Each job reports a clear PASS / FAIL / Skipped status
# so release captains can gate a promotion on a single green tick.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Studio launch-hardening smoke suite
    runs-on: ubuntu-latest
    env:
      STAGE: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund 2>&1 | tee npm-install.log

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-npm-install-log
          path: npm-install.log
          if-no-files-found: ignore

      - name: Prepare report directory
        run: mkdir -p reports

      - name: ingest-preflight — client + server contract
        id: preflight
        continue-on-error: true
        run: npx vitest run --reporter=verbose --reporter=json --outputFile=reports/preflight.json src/test/smoke/ingest-preflight.test.ts src/test/smoke/ingest-preflight-telemetry.test.ts 2>&1 | tee reports/preflight.log

      - name: Upload preflight reports
        if: steps.preflight.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: preflight-reports
          path: reports/preflight.*

      - name: Studio onboarding — no re-loop regression
        id: onboarding
        continue-on-error: true
        run: npx vitest run --reporter=verbose --reporter=json --outputFile=reports/onboarding.json src/test/smoke/studio-onboarding.test.tsx 2>&1 | tee reports/onboarding.log

      - name: Upload onboarding reports
        if: steps.onboarding.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-reports
          path: reports/onboarding.*

      - name: Active Production + Ingest hardening
        id: ingest
        continue-on-error: true
        run: npx vitest run --reporter=verbose --reporter=json --outputFile=reports/ingest.json src/test/smoke/ingest-hardening.test.ts 2>&1 | tee reports/ingest.log

      - name: Upload ingest reports
        if: steps.ingest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ingest-reports
          path: reports/ingest.*

      - name: OCI connection failure surface
        id: oci
        continue-on-error: true
        run: npx vitest run --reporter=verbose --reporter=json --outputFile=reports/oci.json src/test/smoke/oci-connection-failure.test.ts 2>&1 | tee reports/oci.log

      - name: Upload OCI reports
        if: steps.oci.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: oci-reports
          path: reports/oci.*

      - name: Report
        run: |
          set -e
          report() { echo "- $1: $2"; }
          echo "## Launch-hardening regression report" >> $GITHUB_STEP_SUMMARY
          report "ingest-preflight (client + server)" "${{ steps.preflight.outcome }}" >> $GITHUB_STEP_SUMMARY
          report "studio onboarding" "${{ steps.onboarding.outcome }}" >> $GITHUB_STEP_SUMMARY
          report "active production + ingest hardening" "${{ steps.ingest.outcome }}" >> $GITHUB_STEP_SUMMARY
          report "OCI connection failure" "${{ steps.oci.outcome }}" >> $GITHUB_STEP_SUMMARY
          fail=0
          for outcome in \
            "${{ steps.preflight.outcome }}" \
            "${{ steps.onboarding.outcome }}" \
            "${{ steps.ingest.outcome }}" \
            "${{ steps.oci.outcome }}"; do
            case "$outcome" in
              success) ;;
              skipped) echo "::warning::a smoke step was skipped ($outcome)" ;;
              *) fail=1 ;;
            esac
          done
          if [ "$fail" = "1" ]; then
            echo "::error::One or more launch-hardening smoke tests failed. See uploaded reports for the exact assertion."
            exit 1
          fi
          echo "All launch-hardening smoke tests PASS."
