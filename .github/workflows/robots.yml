name: robots.txt policy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "public/robots.txt"
      - "src/test/robots.test.ts"
      - ".github/workflows/robots.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert robots.txt allow/disallow policy
        run: bunx vitest run src/test/robots.test.ts
