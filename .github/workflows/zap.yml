name: OWASP ZAP DAST Scan

on:
  schedule:
    - cron: "0 4 * * 0" # Every Sunday at 04:00 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          target: "https://streamvista.in"
          rules_file_name: ".github/zap-rules.tsv"
          cmd_options: "-a"
          fail_action: false # report issues without failing the build
          issue_title: "OWASP ZAP Baseline Scan Report"
          token: ${{ secrets.GITHUB_TOKEN }}
