name: StreamVista MCP Manual Recovery Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamvista-mcp-recovery-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require safe deployment target and credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STREAMVISTA_SUPABASE_PROJECT_REF: ${{ vars.STREAMVISTA_SUPABASE_PROJECT_REF }}
        run: |
          DECOMMISSIONED_REF="hllgmkfqgeuqlmpcirvn"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is required."
            exit 1
          fi
          if [ -z "$STREAMVISTA_SUPABASE_PROJECT_REF" ]; then
            echo "STREAMVISTA_SUPABASE_PROJECT_REF is required."
            exit 1
          fi
          if [ "$STREAMVISTA_SUPABASE_PROJECT_REF" = "$DECOMMISSIONED_REF" ]; then
            echo "Refusing to deploy against the decommissioned StreamVista backend."
            exit 1
          fi

      - name: Verify deployable MCP artifacts are current
        env:
          STREAMVISTA_SUPABASE_PROJECT_REF: ${{ vars.STREAMVISTA_SUPABASE_PROJECT_REF }}
        run: |
          DECOMMISSIONED_REF="hllgmkfqgeuqlmpcirvn"
          EXPECTED_ISSUER="https://${STREAMVISTA_SUPABASE_PROJECT_REF}.supabase.co/auth/v1"
          test -f supabase/functions/mcp/index.ts
          test -f .lovable/mcp/manifest.json
          test -f public/.lovable/mcp/manifest.json
          grep -q "ctrl_connection_health" supabase/functions/mcp/index.ts
          grep -q 'version: "0.3.3"' supabase/functions/mcp/index.ts
          grep -Fq "$EXPECTED_ISSUER" .lovable/mcp/manifest.json
          grep -Fq "$EXPECTED_ISSUER" public/.lovable/mcp/manifest.json
          if grep -R -n -F "$DECOMMISSIONED_REF" \
            supabase/functions/mcp \
            .lovable/mcp \
            public/.lovable/mcp; then
            echo "Decommissioned backend reference detected in deployable MCP artifacts."
            exit 1
          fi

      - name: Deploy to explicitly configured Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STREAMVISTA_SUPABASE_PROJECT_REF: ${{ vars.STREAMVISTA_SUPABASE_PROJECT_REF }}
        run: |
          npx --yes supabase@latest functions deploy mcp \
            --project-ref "$STREAMVISTA_SUPABASE_PROJECT_REF" \
            --no-verify-jwt
