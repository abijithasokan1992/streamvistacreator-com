name: Security Dependency Remediation

on:
  push:
    branches: ["fix/security-ci-remediation"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-ci-remediation

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install current lockfile
        run: npm ci

      - name: Apply targeted dependency remediation
        run: |
          npm install --save-exact @lovable.dev/mcp-js@0.25.0 react-router-dom@7.18.2
          npm install --save-dev --save-exact vite@6.4.3 postcss@8.5.23
          npm audit fix || true

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Capture remediated audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json --audit-level=high > remediated-audit.json
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          node - <<'EOF'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('remediated-audit.json', 'utf8'));
          const v = report.metadata?.vulnerabilities || {};
          console.log(`remediated audit: total=${v.total ?? 'unknown'} high=${v.high ?? 0} critical=${v.critical ?? 0}`);
          EOF

      - name: Upload remediated dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: remediated-dependencies
          path: |
            package.json
            package-lock.json
            remediated-audit.json
          if-no-files-found: error

      - name: Commit remediated manifests
        if: github.event_name == 'push' && steps.audit.outputs.status == '0'
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency manifest changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): remediate dependency vulnerabilities"
          git push origin HEAD:fix/security-ci-remediation

      - name: Enforce high/critical audit gate
        if: steps.audit.outputs.status != '0'
        run: exit 1
