name: StreamVista GitHub MCP Build and Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "src/lib/mcp/**"
      - "supabase/functions/mcp/**"
      - "supabase/config.toml"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/webpack.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamvista-mcp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure audit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate application and MCP bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://hllgmkfqgeuqlmpcirvn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: github-build-placeholder-not-a-runtime-secret

      - name: Verify generated MCP bundle
        run: |
          test -f supabase/functions/mcp/index.ts
          test -f .lovable/mcp/manifest.json
          test -f public/.lovable/mcp/manifest.json
          grep -q "ctrl_connection_health" supabase/functions/mcp/index.ts
          grep -q 'version: "0.3.2"' supabase/functions/mcp/index.ts

      - name: Transfer generated bundle ownership to GitHub
        run: |
          sed -i '1{/AUTO-GENERATED by @lovable.dev\/mcp-js/d;}' supabase/functions/mcp/index.ts
          sed -i '1{/To take ownership/d;}' supabase/functions/mcp/index.ts

      - name: Commit generated MCP artifacts
        run: |
          git add supabase/functions/mcp/index.ts .lovable/mcp/manifest.json public/.lovable/mcp/manifest.json
          if git diff --cached --quiet; then
            echo "MCP artifacts already current."
          else
            git commit -m "build(mcp): regenerate GitHub-owned deployable bundle [skip ci]"
            git push origin HEAD:main
          fi

      - name: Check Supabase deployment credential
        id: credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p deployment-status
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            printf '{"component":"mcp","status":"blocked","reason":"missing_SUPABASE_ACCESS_TOKEN","source_commit":"%s"}\n' "$GITHUB_SHA" > deployment-status/mcp.json
            git add deployment-status/mcp.json
            git commit -m "ops(mcp): record deployment credential blocker [skip ci]" || true
            git push origin HEAD:main
            exit 1
          fi

      - name: Install Supabase CLI
        run: npm install --global supabase

      - name: Deploy MCP Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy mcp \
            --project-ref hllgmkfqgeuqlmpcirvn \
            --no-verify-jwt

      - name: Record successful deployment
        run: |
          mkdir -p deployment-status
          printf '{"component":"mcp","status":"deployed","project_ref":"hllgmkfqgeuqlmpcirvn","version":"0.3.2","source_commit":"%s"}\n' "$GITHUB_SHA" > deployment-status/mcp.json
          git add deployment-status/mcp.json
          git commit -m "ops(mcp): record successful v0.3.2 deployment [skip ci]" || true
          git push origin HEAD:main

      - name: Upload deployable MCP bundle
        uses: actions/upload-artifact@v4
        with:
          name: streamvista-mcp-${{ github.sha }}
          path: |
            supabase/functions/mcp/**
            supabase/config.toml
            deployment-status/mcp.json
          if-no-files-found: error
          retention-days: 14
