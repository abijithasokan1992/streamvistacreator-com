name: Security Dependency Remediation

on:
  push:
    branches: ["fix/security-ci-remediation"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: security-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/security-ci-remediation
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Repair known release gates
        run: node scripts/repair-release-gates.mjs

      - name: Harden GitHub Action supply chain
        run: node scripts/harden-github-actions.mjs

      - name: Install current lockfile
        run: npm ci

      - name: Apply targeted dependency remediation
        run: |
          npm install --save-exact @lovable.dev/mcp-js@0.25.0 react-router-dom@7.18.2
          npm install --save-dev --save-exact vite@6.4.3 postcss@8.5.23
          npm audit fix || true

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Capture remediated audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json --audit-level=high > remediated-audit.json
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          node - <<'EOF'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('remediated-audit.json', 'utf8'));
          const v = report.metadata?.vulnerabilities || {};
          console.log(`remediated audit: total=${v.total ?? 'unknown'} low=${v.low ?? 0} moderate=${v.moderate ?? 0} high=${v.high ?? 0} critical=${v.critical ?? 0}`);
          EOF

      - name: Upload remediated dependency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remediated-dependencies
          path: |
            package.json
            package-lock.json
            remediated-audit.json
            osv-scanner.toml
          if-no-files-found: error

      - name: Commit verified release-gate repairs
        if: steps.audit.outputs.status == '0'
        run: |
          if git diff --quiet; then
            echo "No verified remediation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github scripts/harden-github-actions.mjs scripts/repair-release-gates.mjs osv-scanner.toml src/components/streamvista/Pricing.tsx src/pages/Contact.tsx src/components/streamvista/Footer.tsx
          git commit -m "fix(release): clear security and accessibility gates"
          git push origin HEAD:fix/security-ci-remediation

      - name: Enforce high/critical audit gate
        if: steps.audit.outputs.status != '0'
        run: exit 1
