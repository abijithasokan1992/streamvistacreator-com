name: CodeQL Security Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 5 * * 1" # Every Monday at 05:30 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a905abd23f045faf57fc7c660951e15358da8ed0 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@a905abd23f045faf57fc7c660951e15358da8ed0 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@a905abd23f045faf57fc7c660951e15358da8ed0 # v3
        with:
          category: "/language:${{ matrix.language }}"
