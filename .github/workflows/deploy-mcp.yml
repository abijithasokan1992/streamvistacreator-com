name: Deploy StreamVista MCP

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/mcp/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-streamvista-mcp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configure audit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify GitHub-owned MCP bundle
        run: |
          test -f supabase/functions/mcp/index.ts
          grep -q "ctrl_connection_health" supabase/functions/mcp/index.ts
          grep -q 'version: "0.3.2"' supabase/functions/mcp/index.ts
          if head -n 2 supabase/functions/mcp/index.ts | grep -q "AUTO-GENERATED"; then
            echo "MCP bundle is not GitHub-owned."
            exit 1
          fi

      - name: Require deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p deployment-status
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            printf '{"component":"mcp","status":"blocked","reason":"missing_SUPABASE_ACCESS_TOKEN","source_commit":"%s"}\n' "$GITHUB_SHA" > deployment-status/mcp.json
            git add deployment-status/mcp.json
            git commit -m "ops(mcp): record missing deployment credential [skip ci]" || true
            git push origin HEAD:main
            exit 1
          fi

      - name: Deploy directly to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --yes supabase@latest functions deploy mcp \
            --project-ref hllgmkfqgeuqlmpcirvn \
            --no-verify-jwt

      - name: Record deployment receipt
        run: |
          mkdir -p deployment-status
          printf '{"component":"mcp","status":"deployed","project_ref":"hllgmkfqgeuqlmpcirvn","version":"0.3.2","source_commit":"%s"}\n' "$GITHUB_SHA" > deployment-status/mcp.json
          git add deployment-status/mcp.json
          git commit -m "ops(mcp): deployed v0.3.2 to Supabase [skip ci]" || true
          git push origin HEAD:main
