name: Accessibility – axe-core

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: axe-core WCAG public-route gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Start preview server
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          echo $! > preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Install ChromeDriver matching runner Chrome
        run: |
          set -e
          CHROME_MAJOR=$(google-chrome --version | grep -oE '[0-9]+' | head -n1)
          npx --yes browser-driver-manager@2.0.1 install "chrome@${CHROME_MAJOR}"
          set -a
          source "$HOME/.browser-driver-manager/.env"
          set +a
          case "$CHROMEDRIVER_TEST_PATH" in
            /*) DRIVER_PATH="$CHROMEDRIVER_TEST_PATH" ;;
            *) DRIVER_PATH="$HOME/$CHROMEDRIVER_TEST_PATH" ;;
          esac
          test -x "$DRIVER_PATH"
          echo "AXE_CHROMEDRIVER_PATH=$DRIVER_PATH" >> "$GITHUB_ENV"

      - name: Run axe-core against public routes
        run: |
          set -e
          mkdir -p reports/axe
          TAGS="wcag2a,wcag2aa,wcag21a,wcag21aa"
          ROUTES=(
            "/"
            "/pricing"
            "/about"
            "/contact"
            "/auth"
            "/onboarding"
            "/solutions/ai-content-licensing"
          )
          fail=0
          for route in "${ROUTES[@]}"; do
            slug=$(echo "$route" | sed 's|/|_|g; s|^_||; s|^$|root|')
            [ -z "$slug" ] && slug=root
            if ! npx --yes @axe-core/cli@4 \
              "http://127.0.0.1:4173${route}" \
              --chromedriver-path "$AXE_CHROMEDRIVER_PATH" \
              --tags "$TAGS" \
              --exit \
              --save "reports/axe/${slug}.json"; then
              echo "::error::axe violations on ${route}"
              fail=1
            fi
          done
          exit $fail

      - name: Upload axe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axe-reports
          path: reports/axe/*.json
          if-no-files-found: warn

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill "$(cat preview.pid)" || true
          fi
