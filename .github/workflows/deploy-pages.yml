name: Build StreamVista Frontend

# Vercel is the canonical automatic deployment path for this repository.
# GitHub Pages is not enabled, so keep this legacy/recovery deployment manual
# to avoid failing every main-branch push at actions/configure-pages.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://offline.streamvista.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: offline-public-shell

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamvista-frontend
          path: dist
          if-no-files-found: error
          retention-days: 7
