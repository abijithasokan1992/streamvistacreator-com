name: One-time Action Digest Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  pin:
    if: github.event.pull_request.head.ref == 'fix/ci-security-scanner-tooling' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Resolve mutable action refs to immutable SHAs
        run: |
          python <<'PY'
          import pathlib
          import re
          import subprocess

          root = pathlib.Path('.github/workflows')
          pattern = re.compile(r'(?P<prefix>uses:\s*["\']?)(?P<action>[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[^@\s"\'#]+)?)@(?P<ref>[^\s"\'#]+)(?P<quote>["\']?)')
          cache = {}
          unresolved = []

          def resolve(action, ref):
              if re.fullmatch(r'[0-9a-fA-F]{40}', ref):
                  return ref.lower()
              repo = '/'.join(action.split('/')[:2])
              key = (repo, ref)
              if key in cache:
                  return cache[key]
              remote = f'https://github.com/{repo}.git'
              specs = [f'refs/tags/{ref}^{{}}', f'refs/tags/{ref}', f'refs/heads/{ref}']
              try:
                  out = subprocess.check_output(['git', 'ls-remote', remote, *specs], text=True, stderr=subprocess.STDOUT)
              except subprocess.CalledProcessError as exc:
                  unresolved.append((action, ref, exc.output.strip()))
                  return None
              refs = {}
              for line in out.splitlines():
                  if not line.strip():
                      continue
                  sha, name = line.split('\t', 1)
                  refs[name] = sha
              sha = refs.get(f'refs/tags/{ref}^{{}}') or refs.get(f'refs/tags/{ref}') or refs.get(f'refs/heads/{ref}')
              if not sha:
                  unresolved.append((action, ref, 'ref not found'))
                  return None
              cache[key] = sha
              return sha

          changed = 0
          for path in sorted(root.glob('*.y*ml')):
              text = path.read_text()
              def repl(match):
                  nonlocal_changed = False
                  action = match.group('action')
                  ref = match.group('ref')
                  if action.startswith('./') or '${{' in ref:
                      return match.group(0)
                  sha = resolve(action, ref)
                  if not sha or sha == ref:
                      return match.group(0)
                  return f"{match.group('prefix')}{action}@{sha}{match.group('quote')} # {ref}"
              new_text = pattern.sub(repl, text)
              if new_text != text:
                  path.write_text(new_text)
                  changed += 1

          print(f'Updated workflow files: {changed}')
          if unresolved:
              for action, ref, detail in unresolved:
                  print(f'UNRESOLVED {action}@{ref}: {detail}')
              raise SystemExit(1)
          PY

      - name: Commit pinned action SHAs
        run: |
          if git diff --quiet; then
            echo "No mutable action refs remain."
            exit 0
          fi
          git config user.name "StreamVista Factory"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows
          git commit -m "fix(security): pin GitHub Actions to immutable SHAs"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
