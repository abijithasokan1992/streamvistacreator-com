name: robots.txt policy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "public/robots.txt"
      - "src/test/robots.test.ts"
      - ".github/workflows/robots.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert robots.txt allow/disallow policy
        run: npx vitest run src/test/robots.test.ts
