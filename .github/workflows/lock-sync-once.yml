name: One-time Lockfile Sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'fix/ci-security-scanner-tooling' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "StreamVista Factory"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): sync lockfile after removing unused MCP generator"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
