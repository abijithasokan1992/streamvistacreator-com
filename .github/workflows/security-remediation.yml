name: Security Dependency Remediation

on:
  push:
    branches: ["fix/security-ci-remediation"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-ci-remediation

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install current lockfile
        run: npm ci

      - name: Apply targeted dependency remediation
        run: |
          npm install --save-exact @lovable.dev/mcp-js@0.25.0 react-router-dom@7.9.3
          npm install --save-dev --save-exact vite@6.4.3 postcss@8.5.23
          npm audit fix || true

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Commit remediated manifests
        if: success()
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency manifest changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): remediate dependency vulnerabilities"
          git push origin HEAD:fix/security-ci-remediation
