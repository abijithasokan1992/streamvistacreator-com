name: Deploy StreamVista MCP

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/mcp/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-streamvista-mcp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure audit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify GitHub-owned MCP bundle
        run: |
          test -f supabase/functions/mcp/index.ts
          grep -q "ctrl_connection_health" supabase/functions/mcp/index.ts
          if head -n 2 supabase/functions/mcp/index.ts | grep -q "AUTO-GENERATED"; then
            echo "MCP bundle is not GitHub-owned."
            exit 1
          fi

      - name: Require explicit deployment target and credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STREAMVISTA_SUPABASE_PROJECT_REF: ${{ vars.STREAMVISTA_SUPABASE_PROJECT_REF }}
        run: |
          mkdir -p deployment-status
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            printf '{"component":"mcp","status":"blocked","reason":"missing_SUPABASE_ACCESS_TOKEN","source_commit":"%s"}\n' "$GITHUB_SHA" > deployment-status/mcp.json
            exit 1
          fi
          if [ -z "$STREAMVISTA_SUPABASE_PROJECT_REF" ]; then
            printf '{"component":"mcp","status":"blocked","reason":"missing_STREAMVISTA_SUPABASE_PROJECT_REF","source_commit":"%s"}\n' "$GITHUB_SHA" > deployment-status/mcp.json
            exit 1
          fi

      - name: Deploy to explicitly configured Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STREAMVISTA_SUPABASE_PROJECT_REF: ${{ vars.STREAMVISTA_SUPABASE_PROJECT_REF }}
        run: |
          npx --yes supabase@latest functions deploy mcp \
            --project-ref "$STREAMVISTA_SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Record deployment receipt
        env:
          STREAMVISTA_SUPABASE_PROJECT_REF: ${{ vars.STREAMVISTA_SUPABASE_PROJECT_REF }}
        run: |
          mkdir -p deployment-status
          printf '{"component":"mcp","status":"deployed","project_ref":"%s","version":"0.3.3","source_commit":"%s"}\n' "$STREAMVISTA_SUPABASE_PROJECT_REF" "$GITHUB_SHA" > deployment-status/mcp.json
          git add deployment-status/mcp.json
          git commit -m "ops(mcp): record deployed v0.3.3 [skip ci]" || true
          git push origin HEAD:main
